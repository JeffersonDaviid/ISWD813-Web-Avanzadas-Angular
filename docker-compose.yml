services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres_db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: app_clientes
      POSTGRES_USER: client
      POSTGRES_PASSWORD: clientpass
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_clientes"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
