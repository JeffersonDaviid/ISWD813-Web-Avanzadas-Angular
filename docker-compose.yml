services:
  postgres:
    image: postgres:16-alpine
    container_name: productos
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: productos
      POSTGRES_USER: user
      POSTGRES_PASSWORD: userpass
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_clientes"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
